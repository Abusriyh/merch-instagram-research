name: Vision audit T-shirt filter

on:
  push:
    branches: [main]
    paths:
      - 'vision_filter.py'
      - '.github/workflows/vision-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install vision dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow==11.3.0 huggingface_hub transformers ultralytics torch torchvision
      - name: Download latest US fashion panel artifact
        run: |
          ARTIFACT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="us-fashion-500" and (.expired|not))] | sort_by(.created_at) | reverse | .[0].id')
          if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
            echo "No us-fashion-500 artifact found" >&2
            exit 1
          fi
          echo "Using artifact id $ARTIFACT_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > source.zip
          mkdir -p source
          unzip -q source.zip -d source
          find source -maxdepth 2 -type f | head -20
      - name: Run conservative worn T-shirt filter
        run: python vision_filter.py source --out vision_audit
      - name: Upload vision QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tshirt-vision-audit
          path: vision_audit/
          if-no-files-found: error
          retention-days: 7
          compression-level: 4
