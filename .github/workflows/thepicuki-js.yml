name: Inspect ThePicuki JavaScript

on:
  push:
    branches: [main]
    paths:
      - 'inspect_thepicuki_js.py'
      - '.github/workflows/thepicuki-js.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install curl_cffi==0.13.0
      - run: python inspect_thepicuki_js.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thepicuki-js-inspection
          path: thepicuki_js_inspection.json
          if-no-files-found: warn
          retention-days: 7
